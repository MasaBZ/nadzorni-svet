<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nadzorni svet</title>
<meta name="theme-color" content="#1d6a57">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nadzorni svet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}

/* Layout: delovni pult nadzornega sveta — glava z zavihki, ena osrednja delovna kolona, tabele s tabularnimi številkami */
:root{
  --bg:#f3f5f3; --surface:#ffffff; --sunk:#e9edea; --ink:#18221f; --muted:#56655f; --line:#d7ded9;
  --accent:#1d6a57; --accent-soft:#dcebe5; --on-accent:#ffffff; --plan:#b4c1bb;
  --good:#2b7448; --good-soft:#dff0e5; --warn:#9c5a12; --warn-soft:#f6ead9; --bad:#ad322b; --bad-soft:#f7e1df;
  --f-display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111715; --surface:#18201d; --sunk:#202a27; --ink:#e3ebe7; --muted:#97a6a0; --line:#2b3733;
  --accent:#5fbf9f; --accent-soft:#1f3a32; --on-accent:#0d1714; --plan:#45534e;
  --good:#71c48f; --good-soft:#1c3326; --warn:#e2a35a; --warn-soft:#382a17; --bad:#ec7f76; --bad-soft:#3b1e1c;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#18201d; --sunk:#202a27; --ink:#e3ebe7; --muted:#97a6a0; --line:#2b3733;
  --accent:#5fbf9f; --accent-soft:#1f3a32; --on-accent:#0d1714; --plan:#45534e;
  --good:#71c48f; --good-soft:#1c3326; --warn:#e2a35a; --warn-soft:#382a17; --bad:#ec7f76; --bad-soft:#3b1e1c;
  color-scheme:dark }
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top, 0px)}
header.top .wrap{padding-block:14px 0;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--f-display);font-weight:600;font-size:24px;line-height:1.2;margin:2px 0 0;text-wrap:balance}
.conn{font-size:13px;color:var(--muted)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
nav.tabs button{appearance:none;border:0;background:none;font:inherit;font-weight:500;color:var(--muted);padding:9px 14px 11px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:hover{color:var(--ink)}
main{padding-block:24px 64px;display:flex;flex-direction:column;gap:20px}
h2{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0;line-height:1.25;text-wrap:balance}
h3{font-size:15px;font-weight:600;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
p{margin:0}
.lede{color:var(--muted);max-width:68ch}
button.btn,.btn{appearance:none;font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 13px;border-radius:var(--r);cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.3}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;width:100%;min-width:0}
textarea{line-height:1.5;resize:vertical}
textarea.doc{min-height:420px;font-size:14.5px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat{display:flex;flex-direction:column;gap:2px;padding:10px 12px;background:var(--sunk);border-radius:var(--r)}
.stat .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:20px;font-weight:500}
.stat .l{font-size:12.5px;color:var(--muted)}
.stat.bad .v{color:var(--bad)} .stat.good .v{color:var(--good)} .stat.warn .v{color:var(--warn)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;background:var(--sunk);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tfoot td{font-weight:600;background:var(--sunk)}
table.fin input{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;padding:5px 7px;min-width:96px}
tr.overdue td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .main{min-width:0;flex:1}
.sejarow{display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;font:inherit;color:inherit;text-align:left;width:100%}
.sejarow:hover{background:var(--sunk)}
.sejano{font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1}
.sejano small{display:block;font-family:var(--f-body);font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;color:var(--muted)}
.step{display:flex;gap:14px;align-items:baseline}
.step .n{font-family:var(--f-display);font-size:26px;font-weight:600;color:var(--accent);line-height:1;min-width:20px}
.tocka{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.tocka:last-child{border-bottom:0}
.tocka .n{font-family:var(--f-mono);font-weight:500;padding-top:8px;color:var(--muted)}
.tocka .body{display:flex;flex-direction:column;gap:8px;min-width:0}
.tocka .tools{display:flex;flex-direction:column;gap:2px}
.note{background:var(--accent-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;font-size:14px;max-width:80ch}
.note.warn{background:var(--warn-soft)}
.savebar{position:sticky;bottom:0;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px));display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 -4px 16px rgb(0 0 0 / .06)}
.savebar[data-dirty="0"] .dirtymsg{display:none}
.savebar[data-dirty="1"] .cleanmsg{display:none}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px}
.checks label{display:inline-flex;gap:7px;align-items:center;font-size:14px;color:var(--ink)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--muted);stroke-width:1}
.chart .bar-plan{fill:var(--plan)}
.chart .bar-real{fill:var(--accent)}
.chart .ln-plan{fill:none;stroke:var(--plan);stroke-width:2.5;stroke-dasharray:5 4}
.chart .ln-real{fill:none;stroke:var(--accent);stroke-width:2.5}
.chart .dot-real{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:6px}
.meter{height:8px;background:var(--sunk);border-radius:999px;overflow:hidden;min-width:80px}
.meter b{display:block;height:100%;background:var(--accent);border-radius:999px}
.meter.good b{background:var(--good)} .meter.warn b{background:var(--warn)} .meter.bad b{background:var(--bad)}
.score{font-family:var(--f-display);font-size:44px;font-weight:600;line-height:1}
.pre{white-space:pre-wrap;background:var(--sunk);border-radius:var(--r);padding:12px 14px;font-size:13.5px;max-height:340px;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:14px;z-index:50;max-width:min(92vw,520px);box-shadow:0 6px 24px rgb(0 0 0 / .2)}
.busy::after{content:"";width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.busy::after{animation:none}}
@media (max-width:560px){
  .sejarow{grid-template-columns:58px 1fr}
  .sejarow .chip{grid-column:2}
  h1{font-size:21px}
  .panel{padding:16px}
  .tocka{grid-template-columns:22px 1fr}
  .tocka .tools{grid-column:2;flex-direction:row}
}


main{padding-bottom:calc(64px + env(safe-area-inset-bottom, 0px))}
.conn{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
.dot.ok{background:var(--good)} .dot.busy{background:var(--warn)} .dot.err{background:var(--bad)}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:14px}
.banner.warn{background:var(--warn-soft)}
.rec{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:var(--r);background:var(--sunk)}
.rec .time{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:34px;font-weight:500;line-height:1}
.rec.live .time{color:var(--bad)}
.recdot{width:12px;height:12px;border-radius:50%;background:var(--bad);display:inline-block;animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.recdot{animation:none}}
.level{height:10px;background:var(--surface);border-radius:999px;overflow:hidden}
.level b{display:block;height:100%;width:0;background:var(--good);transition:width .1s linear}
.btn.rec-btn{background:var(--bad);border-color:var(--bad);color:#fff;font-size:16px;padding:11px 18px}
audio{width:100%;max-width:420px;height:40px}
input[type=password]{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;width:100%;min-width:0}
@media (max-width:560px){ header.top .wrap{padding-block:8px 0;gap:6px} .stats{grid-template-columns:repeat(auto-fit,minmax(96px,1fr))} header.top .eyebrow{display:none} header.top h1{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100vw - 32px)} .brand{flex-direction:column;gap:2px} .conn{font-size:12px} .btn{padding:9px 13px} nav.tabs button{padding:9px 11px 11px} }

</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <div>
        <div class="eyebrow">Nadzorni svet</div>
        <h1 id="firma">Nadzorni svet</h1>
      </div>
      <div class="conn"><span id="druzbaSwitch" hidden><select id="druzbaSel" aria-label="Izberi družbo" style="width:auto;max-width:240px;font-size:13px;padding:4px 8px"></select></span><span class="dot" id="syncDot"></span><span id="conn">Nalagam …</span>
        <button class="btn ghost small" id="installBtn" hidden>Namesti aplikacijo</button></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Razdelki">
      <button data-tab="pregled">Pregled</button>
      <button data-tab="seje">Seje</button>
      <button data-tab="sklepi">Sklepi</button>
      <button data-tab="poslovanje">Poslovanje</button>
      <button data-tab="direktor">Uspešnost direktorja</button>
      <button data-tab="predloge">Pretekli zapisniki</button>
      <button data-tab="nastavitve">Nastavitve</button>
    </nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<div class="toast" id="toast" hidden></div>
<script src="config.js"></script>
<script src="msal-browser.min.js"></script>
<script src="jszip.min.js"></script>
<script src="mammoth.browser.min.js"></script>
<script src="xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
